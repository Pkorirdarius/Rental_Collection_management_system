openapi: 3.0.3
info:
  title: Rent Manager Kenya API
  version: 1.0.0
  description: 'Rent management for Kenyan landlords: properties, leases, immutable
    ledger, M-Pesa C2B/STK, cash receipts, arrears and reporting.'
paths:
  /api/v1/audit-logs/:
    get:
      operationId: api_v1_audit_logs_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
