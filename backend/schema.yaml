      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - ENDED
          - PENDING
          - TERMINATED
        description: |-
          * `PENDING` - Pending
          * `ACTIVE` - Active
          * `ENDED` - Ended
          * `TERMINATED` - Terminated
      - in: query
        name: tenant
        schema:
          type: string
          format: uuid
      - in: query
        name: unit
        schema:
          type: string
          format: uuid
      tags:
      - api
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLeaseList'
          description: ''
    post:
      operationId: api_v1_leases_create
