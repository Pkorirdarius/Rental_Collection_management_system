components:
  schemas:
    ActionEnum:
      enum:
      - LOGIN
      - LOGIN_FAILED
      - LOGOUT
      - CREATE
      - UPDATE
      - DELETE
      - RESTORE
      - PAYMENT_RECORDED
      - PAYMENT_REVERSED
      - PAYMENT_MATCHED
      - LEDGER_POSTED
      - REMINDER_SENT
      - STK_PUSH
      - MPESA_CALLBACK
      - EXPORT
      type: string
      description: |-
        * `LOGIN` - Login
        * `LOGIN_FAILED` - Login failed
        * `LOGOUT` - Logout
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `RESTORE` - Restore
        * `PAYMENT_RECORDED` - Payment recorded
        * `PAYMENT_REVERSED` - Payment reversed
        * `PAYMENT_MATCHED` - Payment matched
        * `LEDGER_POSTED` - Ledger posted
        * `REMINDER_SENT` - Reminder sent
        * `STK_PUSH` - STK push
        * `MPESA_CALLBACK` - M-Pesa callback
        * `EXPORT` - Export
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        actor:
          type: string
          readOnly: true
          default: ''
        model_name:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        object_repr:
          type: string
          readOnly: true
        changes:
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        hash:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - changes
      - created_at
      - hash
      - id
      - ip_address
      - model_name
      - object_id
      - object_repr
    EntryTypeEnum:
      enum:
      - RENT_CHARGE
      - LATE_FEE
      - PAYMENT
      - ADJUSTMENT
      - WAIVER
      - DEPOSIT
      - DEPOSIT_REFUND
      - REVERSAL
      type: string
      description: |-
        * `RENT_CHARGE` - Rent charge
        * `LATE_FEE` - Late fee
        * `PAYMENT` - Payment
        * `ADJUSTMENT` - Adjustment
        * `WAIVER` - Waiver
        * `DEPOSIT` - Deposit received
        * `DEPOSIT_REFUND` - Deposit refund
        * `REVERSAL` - Reversal
    LateFeeTypeEnum:
      enum:
      - NONE
      - FLAT
      - PERCENT
      type: string
      description: |-
        * `NONE` - None
        * `FLAT` - Flat amount
        * `PERCENT` - Percentage of rent
    Lease:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant:
          type: string
          format: uuid
        tenant_name:
          type: string
          readOnly: true
        tenant_phone:
          type: string
          readOnly: true
        unit:
          type: string
          format: uuid
        unit_code:
          type: string
          readOnly: true
        property_name:
          type: string
          readOnly: true
        property_id:
          type: string
          format: uuid
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        rent_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        due_day:
          type: integer
          maximum: 28
          minimum: 1
        grace_period_days:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        deposit_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        deposit_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        late_fee_type:
          $ref: '#/components/schemas/LateFeeTypeEnum'
        late_fee_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        late_fee_applies_after_grace:
          type: boolean
        proration_enabled:
          type: boolean
          description: Prorate the first and last month by days occupied.
        status:
          $ref: '#/components/schemas/LeaseStatusEnum'
        terminated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        termination_reason:
          type: string
          maxLength: 255
        notes:
          type: string
        balance:
          type: string
          readOnly: true
        days_overdue:
          type: integer
          readOnly: true
        payment_status:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - balance
      - created_at
      - days_overdue
      - id
      - payment_status
      - property_id
      - property_name
      - rent_amount
      - start_date
      - tenant
      - tenant_name
      - tenant_phone
      - terminated_at
      - unit
      - unit_code
      - updated_at
    LeaseRequest:
      type: object
      properties:
        tenant:
          type: string
          format: uuid
        unit:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        rent_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        due_day:
          type: integer
          maximum: 28
          minimum: 1
        grace_period_days:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        deposit_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        deposit_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        late_fee_type:
          $ref: '#/components/schemas/LateFeeTypeEnum'
        late_fee_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        late_fee_applies_after_grace:
          type: boolean
        proration_enabled:
          type: boolean
          description: Prorate the first and last month by days occupied.
        status:
          $ref: '#/components/schemas/LeaseStatusEnum'
        termination_reason:
          type: string
          maxLength: 255
        notes:
          type: string
      required:
      - rent_amount
      - start_date
      - tenant
      - unit
    LeaseStatusEnum:
      enum:
      - PENDING
      - ACTIVE
      - ENDED
      - TERMINATED
      type: string
      description: |-
        * `PENDING` - Pending
        * `ACTIVE` - Active
        * `ENDED` - Ended
        * `TERMINATED` - Terminated
    LedgerEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        lease:
          type: string
          format: uuid
          readOnly: true
        tenant:
          type: string
          format: uuid
          readOnly: true
        tenant_name:
          type: string
          readOnly: true
        unit:
          type: string
          format: uuid
          readOnly: true
        unit_code:
          type: string
          readOnly: true
        property_name:
          type: string
          readOnly: true
        entry_type:
          allOf:
          - $ref: '#/components/schemas/EntryTypeEnum'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: 'Signed amount: debit positive, credit negative.'
        effective_date:
          type: string
          format: date
          readOnly: true
        period_start:
