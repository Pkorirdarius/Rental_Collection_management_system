  /api/v1/leases/:
    get:
      operationId: api_v1_leases_list
      description: Adds immutable audit records around standard CRUD operations.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
