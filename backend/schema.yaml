          - DEPOSIT
          - DEPOSIT_REFUND
          - LATE_FEE
          - PAYMENT
          - RENT_CHARGE
          - REVERSAL
          - WAIVER
        description: |-
          * `RENT_CHARGE` - Rent charge
          * `LATE_FEE` - Late fee
          * `PAYMENT` - Payment
          * `ADJUSTMENT` - Adjustment
          * `WAIVER` - Waiver
          * `DEPOSIT` - Deposit received
          * `DEPOSIT_REFUND` - Deposit refund
          * `REVERSAL` - Reversal
